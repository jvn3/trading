name: alphadash-ci

# CI for the beginner strategy-agent product (alphadash/). Scoped by paths so it never runs on
# changes to the personal jay-trading engine, and vice versa.
on:
  push:
    paths:
      - "alphadash/**"
      - ".github/workflows/alphadash-ci.yml"
  pull_request:
    paths:
      - "alphadash/**"
      - ".github/workflows/alphadash-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphadash/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphadash/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
