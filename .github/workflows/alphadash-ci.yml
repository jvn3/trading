name: alphadash-ci

# CI for the beginner strategy-agent product (alphadash/). Scoped by paths so it never runs on
# changes to the personal jay-trading engine, and vice versa.
on:
  push:
    paths:
      - "alphadash/**"
      - ".github/workflows/alphadash-ci.yml"
  pull_request:
    paths:
      - "alphadash/**"
      - ".github/workflows/alphadash-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphadash/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphadash/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    # Playwright drives the real stack: FastAPI (sqlite + stub providers + fake LLM) + Vite.
    # Every UI surface must have a spec under alphadash/frontend/e2e/ (project rule, Phase 2).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphadash/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync backend
        run: uv sync
        working-directory: alphadash/backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: alphadash/frontend/test-results/
