# AlphaDash backend Alembic config — isolated from the root repo's alembic setup.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# URL is overridden in env.py from ALPHADASH_DATABASE_URL when set.
sqlalchemy.url = sqlite:///./alphadash.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
